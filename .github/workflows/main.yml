name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project ZIP
        run: |
          mkdir -p temp_dir
          unzip -o bütçe-takip.zip -d temp_dir
          mkdir -p android-project
          # Zip içinden çıkan ana klasörü es geçerek dosyaları doğrudan android-project altına taşır
          cp -r temp_dir/*/* android-project/ 2>/dev/null || cp -r temp_dir/* android-project/

      - name: Prepare Android project
        working-directory: android-project
        run: |
          cp google-services.json app/google-services.json
          sed -i 's/applicationId = "com.aistudio.butcetakip.btqwrx"/applicationId = "com.aistudio.butcetakip"/g' app/build.gradle
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Butce-Takip-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
