name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find and Build Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -type f -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts bulunamadı!"
            echo "GitHub'daki dosyalar:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android proje klasörü:"
          echo "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Butce-Takip-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
