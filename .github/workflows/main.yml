name: Bütçe Takip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Proje dosyalarını bul
        run: |
          echo "=== GRADLE DOSYALARI ==="
          find . -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) | sort
